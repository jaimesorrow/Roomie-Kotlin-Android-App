name: Signed release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/roomie-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      ACCOUNT_DELETION_URL: ${{ vars.ACCOUNT_DELETION_URL }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Restore release credentials
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$FIREBASE_CONFIG"
          test -n "$UPLOAD_KEY"
          printf '%s' "$FIREBASE_CONFIG" | base64 --decode > app/google-services.json
          printf '%s' "$UPLOAD_KEY" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - run: ./gradlew testReleaseUnitTest lintRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: roomie-signed-release
          path: |
            app/build/outputs/bundle/release/
            app/build/outputs/mapping/release/
      - name: Remove credentials
        if: always()
        run: rm -f app/google-services.json "$ANDROID_KEYSTORE_PATH"
